<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>오운</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; color: #161616;
      font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
    .logo { font-size: 44px; font-weight: 900; color: #161616; letter-spacing: -2px; }
    p { margin: 0; line-height: 1.6; color: #555; }
    button { margin-top: 8px; border: 0; border-radius: 12px; padding: 14px 28px;
      background: #c8f135; color: #161616; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="logo">오운</div>
    <p>인터넷에 연결할 수 없어요.<br />네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.href='https://ownapp.kr'">다시 시도</button>
  </main>
</body>
</html>
