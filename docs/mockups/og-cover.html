<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오운 OG 카드 (1200×630)</title>
<style>
  :root{--lime:#c8f135;--lime-dk:#84cc16;--ink:#0f172a;--muted:#64748b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0a0f1a;display:flex;justify-content:center;align-items:center;min-height:100vh;
    font-family:-apple-system,'Segoe UI','Malgun Gothic',sans-serif}

  /* OG/Twitter 카드 표준 1200x630 — 랜딩 히어로 톤(밝은 라임/그린 흰색) */
  .card{
    width:1200px;height:630px;
    transform:scale(.62);transform-origin:center center;
    position:relative;overflow:hidden;color:var(--ink);
    background:linear-gradient(135deg,#fafff0 0%,#ffffff 42%,#f0fdf4 100%);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:66px 84px;
  }
  /* 라임 글로우 (옅게 — 밝은 톤이라 강하면 안 됨) */
  .glow{position:absolute;border-radius:50%;pointer-events:none;filter:blur(2px)}
  .g1{top:-160px;right:-110px;width:520px;height:520px;
    background:radial-gradient(circle,rgba(200,241,53,.45),transparent 65%)}
  .g2{bottom:-180px;left:-130px;width:460px;height:460px;
    background:radial-gradient(circle,rgba(132,204,22,.18),transparent 70%)}

  .row{position:relative;display:flex;align-items:center;gap:18px}
  .logo{font-size:62px;font-weight:900;letter-spacing:-2px;display:flex;align-items:center;gap:2px;color:var(--ink)}
  .logo .chip{background:var(--lime);color:var(--ink);padding:0 18px;border-radius:14px;margin-left:4px;
    box-shadow:0 4px 14px rgba(200,241,53,.45)}

  .badge{position:relative;font-size:22px;font-weight:800;letter-spacing:5px;
    color:#4d7c0f;background:rgba(200,241,53,.32);border:1px solid rgba(132,204,22,.5);
    border-radius:100px;padding:9px 22px;align-self:flex-start}

  .head{position:relative;font-size:80px;font-weight:900;line-height:1.16;letter-spacing:-3px;color:var(--ink)}
  .head .hl{color:var(--lime-dk);position:relative;display:inline-block}
  .head .hl::after{content:'';position:absolute;left:0;right:0;bottom:6px;height:14px;
    background:var(--lime);opacity:.45;z-index:-1;border-radius:4px}

  .feats{position:relative;display:flex;gap:14px;flex-wrap:wrap}
  .feat{font-size:24px;font-weight:700;color:#334155;background:#ffffff;
    border:1.5px solid #e2e8f0;border-radius:100px;padding:11px 22px;
    box-shadow:0 2px 10px rgba(15,23,42,.05)}

  .foot{position:relative;display:flex;justify-content:space-between;align-items:flex-end}
  .foot .tagline{font-size:26px;color:var(--muted);font-weight:600}
  .foot .url{font-size:28px;color:var(--lime-dk);font-weight:900;font-family:'DM Mono',monospace}
</style>
</head>
<body>
  <div class="card">
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="row">
      <div class="logo">오<span class="chip">운</span></div>
      <div class="badge">1인 강사 올인원</div>
    </div>

    <div class="head">AI가 일지를 쓰고,<br><span class="hl">트레이너</span>를 알린다</div>

    <div class="feats">
      <div class="feat">🤖 AI 수업일지</div>
      <div class="feat">👥 회원·결제 관리</div>
      <div class="feat">👤 트레이너 공개 프로필</div>
    </div>

    <div class="foot">
      <div class="tagline">1인 강사를 위한 도구</div>
      <div class="url">ownapp.kr</div>
    </div>
  </div>
</body>
</html>
